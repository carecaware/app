  :root{
    --bg:#16130F;
    --bg-elev:#211C16;
    --bg-elev-2:#2A241C;
    --text:#EDE6DA;
    --text-dim:#A99C8A;
    --accent:#C08A4E;
    --accent-soft:#3A2E1E;
    --good:#8FA382;
    --bad:#C07A6A;
    --border:#382F23;
    --gray-dark:#6B6255;
    --radius:10px;
    --shadow: 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F7F3EC;
      --bg-elev:#FFFFFF;
      --bg-elev-2:#F0EAE0;
      --text:#231E17;
      --text-dim:#6B6255;
      --accent:#9C6B34;
      --accent-soft:#EFE1CC;
      --good:#4F7A4B;
      --bad:#A6432F;
      --border:#E3DACB;
      --gray-dark:#4A453C;
      color-scheme: light;
    }
  }
  :root[data-theme="light"]{
    --bg:#F7F3EC; --bg-elev:#FFFFFF; --bg-elev-2:#F0EAE0; --text:#231E17;
    --text-dim:#6B6255; --accent:#9C6B34; --accent-soft:#EFE1CC; --good:#4F7A4B;
    --bad:#A6432F; --border:#E3DACB; --gray-dark:#4A453C; color-scheme: light;
  }
  *{box-sizing:border-box;}
  html{overflow-y:scroll;scrollbar-gutter:stable;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding:28px 18px 80px;}
  .num{font-variant-numeric:tabular-nums;}
  h1,h2,h3{margin:0;font-weight:600;}
  button{font-family:inherit;cursor:pointer;}
  .icon-btn{background:none;border:none;padding:6px;color:var(--text-dim);display:inline-flex;align-items:center;border-radius:6px;}
  .icon-btn:hover{background:var(--bg-elev-2);color:var(--text);}
  .icon-btn.cifrao-icon:hover{background:none;color:var(--text-dim);}
  .icon-btn.danger-hover:hover{background:var(--bg-elev-2);color:var(--bad);}
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .status-icons{display:inline-flex;align-items:center;gap:4px;}
  .status-icon-btn{background:none;border:none;padding:3px;display:inline-flex;align-items:center;border-radius:6px;line-height:0;}
  .status-icon-btn:hover{background:var(--bg-elev-2);}
  .comanda-day-total{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 18px;border-top:1px dashed var(--border);margin-top:4px;}
  .comanda-day-total h2{margin:0;font-size:19px;line-height:1.2;}
  .comanda-day-total .label{color:var(--text-dim);font-weight:600;}
  .comanda-day-total .value{font-weight:700;}
  .comanda-day-total .value.clickable{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;}
  .comanda-day-total .value.clickable:hover{color:var(--accent);}
  .comanda-day-total .value.strike{text-decoration:line-through;color:var(--text-dim);font-weight:600;}
  .comanda-day-total.closed{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;}
  .comanda-day-total.closed .label{justify-self:start;}
  .comanda-day-total.closed .value{justify-self:end;}
  .pago-label{justify-self:center;color:var(--accent);font-weight:800;letter-spacing:.06em;cursor:pointer;}
  .pago-label.pago-label-disabled{cursor:default;}
  .pago-label.transferida-label{font-style:italic;font-weight:700;letter-spacing:0;font-size:12px;text-align:center;white-space:normal;line-height:1.25;}
  .comanda-undo-bar{position:fixed;bottom:20px;right:20px;display:flex;gap:10px;z-index:55;}
  .comanda-undo-bar .undo-btn{position:static;}
  .fechar-comanda-btn-inline{width:100%;margin-top:10px;background:var(--accent);color:var(--bg-elev);border:none;}
  .fechar-comanda-btn-inline:hover{opacity:.88;}

  /* header */
  .title-row{display:flex;align-items:center;gap:8px;margin-bottom:22px;position:relative;padding-right:34px;}
  .mute-toggle{position:absolute;top:2px;right:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:none;border:none;border-radius:50%;color:var(--text-dim);opacity:.55;padding:0;cursor:pointer;}
  .mute-toggle:hover{opacity:1;color:var(--accent);}
  .mute-toggle.off{opacity:.4;}
  .title-row h1{font-size:28px;letter-spacing:-0.01em;cursor:pointer;}
  .title-row h1:hover{color:var(--accent);}
  .title-row input{font-size:23px;font-weight:600;background:none;border:none;border-bottom:1px solid var(--accent);color:var(--text);font-family:inherit;padding:0;min-width:0;flex:1;}

  /* nav grid */
  .nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px;}
  .nav-btn{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 14px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:8px;
    transition:border-color .15s ease, transform .1s ease;
  }
  .nav-btn.wide{grid-column:span 2;}
  .nav-btn.narrow{grid-column:span 1;padding:12px 8px;gap:6px;}
  .nav-btn.narrow span{font-size:12px;}
  .nav-btn:hover{border-color:var(--accent);}
  .nav-btn:active{transform:scale(0.98);}
  .nav-btn svg{color:var(--accent);flex-shrink:0;}
  .nav-btn span{font-size:14px;font-weight:500;line-height:1.2;}

  /* mobile: tighten the grid and shrink the narrow buttons' icon/text so
     labels like "Histórico de Preços" fit in two lines instead of
     spilling into a cramped third line */
  @media (max-width:480px){
    #app{padding:22px 14px 76px;}
    .nav-grid{gap:8px;}
    .nav-btn{padding:14px 10px;}
    .nav-btn.narrow{padding:10px 6px;gap:5px;}
    .nav-btn.narrow svg{width:16px;height:16px;}
    .nav-btn.narrow span{font-size:11.5px;line-height:1.15;word-break:break-word;}
  }
  @media (max-width:360px){
    #app{padding:20px 10px 72px;}
    .nav-grid{gap:6px;}
    .nav-btn{padding:12px 8px;}
    .nav-btn span{font-size:13px;}
    .nav-btn.narrow{padding:8px 4px;}
    .nav-btn.narrow span{font-size:11px;}
  }

  /* card */
  .card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .card + .card{margin-top:14px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .card-head h2{font-size:14px;color:var(--text-dim);font-weight:500;}

  .log-scroll{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:5px;margin-right:-5px;}
  .log-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border);font-size:13px;}
  .log-row:last-child{border-bottom:none;}
  .log-date{color:var(--text-dim);width:70px;flex-shrink:0;}
  .log-vals{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;}
  .log-vals b{font-weight:600;}
  .lucro-val{font-weight:600;}
  .log-vals .col-val{display:inline-block;width:11ch;text-align:right;font-variant-numeric:tabular-nums;}
  .log-vals .pendente-val{display:inline-block;width:12ch;text-align:right;font-variant-numeric:tabular-nums;}
  .pendente-val{color:var(--text-dim);font-size:12px;}
  .pendente-val.clickable{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;}
  .editable-num{cursor:pointer;}
  .editable-num .val-text{border-bottom:1px dashed transparent;}
  .editable-num:hover .val-text{border-bottom-color:var(--text-dim);}
  .inline-edit{width:74px;text-align:right;background:var(--bg-elev-2);border:1px solid var(--accent);border-radius:6px;padding:3px 6px;color:var(--text);font-family:inherit;font-size:13px;}
  .tag-compra{color:var(--bad);}
  .tag-venda{color:var(--good);}

  .more-row{display:flex;justify-content:flex-end;margin-top:8px;}
  .more-row button{background:none;border:none;color:var(--accent);font-size:13px;font-weight:500;padding:6px 2px;}
  .more-row button:hover{text-decoration:underline;}
  .more-row button[data-action="ver-menos"]{ filter:brightness(0.72); }

  .stock-hint{margin-top:14px;padding:0 4px;}
  .stock-hint p{color:var(--gray-dark);font-size:12px;line-height:1.5;margin:0 0 4px;}
  .stock-hint.collapsed{display:flex;justify-content:flex-end;}
  .hint-actions{display:flex;justify-content:flex-end;}
  .hint-link{background:none;border:none;color:var(--gray-dark);font-size:12px;padding:4px 2px;cursor:pointer;}
  .hint-link:hover{color:var(--text);}

  /* forms */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12px;color:var(--text-dim);}
  .field input, .field select{
    background:var(--bg-elev-2);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;
  }
  .row-inline{display:flex;gap:8px;}
  .row-inline .field{flex:1;margin-bottom:0;}
  .btn{background:var(--accent);color:#1A140C;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;}
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--bad);color:#1A140C;}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}

  .item-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .stock-two-col{column-count:2;column-gap:18px;}
  .stock-two-col .item-row{break-inside:avoid;-webkit-column-break-inside:avoid;}
  @media (max-width:520px){ .stock-two-col{column-count:1;} }

  .stock-search-wrap{position:relative;flex:0 0 33%;max-width:33%;align-self:flex-end;height:41px;display:flex;align-items:center;}
  .stock-search-wrap-full{flex:1 1 100%;max-width:100%;}
  .stock-search-input{width:100%;height:41px;padding:8px 32px 8px 10px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;}
  .stock-search-input:focus{outline:none;border-color:var(--accent);}
  .stock-search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;padding:2px;color:var(--text-dim);display:flex;}
  .stock-search-btn:hover{color:var(--accent);}
  .stock-search-suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;z-index:40;max-height:220px;overflow-y:auto;display:none;}
  .stock-search-suggestions.open{display:block;}
  .stock-search-suggestion{padding:8px 10px;font-size:13px;cursor:pointer;color:var(--text);}
  .stock-search-suggestion:hover{background:var(--bg-elev-2);color:var(--accent);}

  /* binder-style tabs: each one sits partly on top of the next one */
  .sold-tab{position:relative;flex:1 1 auto;white-space:nowrap;margin-left:-16px;background:var(--bg-elev-2);border:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:14px 14px 0 0;padding:8px 20px 8px 20px;font-size:12px;color:var(--text-dim);box-shadow:3px 0 5px -2px rgba(0,0,0,.28);}

  .cue-stick{position:absolute;width:9px;height:280px;transform-origin:top center;pointer-events:none;z-index:-1;display:flex;flex-direction:column;border-radius:4px;overflow:hidden;box-shadow:0 0 6px rgba(0,0,0,.4);}
  .cue-shaft{flex:1;background:linear-gradient(to right, #5C3A1E, #9C6B3F 45%, #6B4423);}
  .cue-ferrule{height:16px;background:#141414;flex-shrink:0;}
  .cue-tip{height:8px;background:#3A6FD6;border-radius:3px 3px 0 0;flex-shrink:0;}

  #app{position:relative;z-index:1;}

  .login-screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:2000;}
  .login-box{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .login-box label{color:#fff;font-size:14px;font-weight:500;letter-spacing:.03em;}
  .login-box input{background:#fff;color:#111;border:none;border-radius:8px;padding:14px 16px;font-size:17px;text-align:center;width:220px;font-family:inherit;}
  .login-box input:focus{outline:2px solid #fff;outline-offset:2px;}
  .login-box .login-btn{width:220px;}
  .login-fade-overlay{position:fixed;inset:0;background:#000;z-index:2000;opacity:1;transition:opacity 1.5s ease;pointer-events:none;}
  .login-fade-overlay.fade-out{opacity:0;}
  .login-error{color:#ff6b6b;font-size:13px;text-align:center;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  /* ===== mobile / touch optimisation ===== */
  html{-webkit-text-size-adjust:100%;}
  button, [data-action], select, label{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .hamburger-btn, .undo-btn{bottom:calc(20px + env(safe-area-inset-bottom, 0px));}
  @media (pointer:coarse), (max-width:520px){

<script>
(function(){

  var STORAGE_KEY = "barapp_data_v1";
  var MONTHS_LABEL = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var MONTHS_LABEL_CAP = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  var WEEKDAY_LABEL = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  var WEEKDAY_LABEL_FULL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

  // ---------- persistence ----------
  // fixed app title (no longer editable by the user)
  var APP_TITLE = "SNOOK BAR ROCK CLUB";
  var APP_TITLE_SHORT = "SNOOK BAR";
  function validTitle(t){ return t===APP_TITLE ? t : APP_TITLE_SHORT; }
  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        parsed.priceLog = parsed.priceLog || [];
        parsed.restockLog = parsed.restockLog || [];
        parsed.dailyAdjustments = parsed.dailyAdjustments || {};
        parsed.titleFont = parsed.titleFont || null;
        parsed.theme = (!parsed.theme || parsed.theme==="default") ? "snooker" : parsed.theme;
        if(parsed.theme==="praia2") parsed.theme = "praia";
        if(parsed.items && parsed.items.length){
          parsed.items.sort(function(a,b){ return a.name.localeCompare(b.name, "pt-BR", {sensitivity:"base"}); });
        }
        parsed.password = (typeof parsed.password==="string" && parsed.password) ? parsed.password : "1234";
        parsed.adminPassword = (typeof parsed.adminPassword==="string" && parsed.adminPassword) ? parsed.adminPassword : "admin";
        parsed.clients = parsed.clients || [];
        if(parsed.clients.length){
          parsed.clients.sort(function(a,b){ return a.name.localeCompare(b.name, "pt-BR", {sensitivity:"base"}); });
        }
        parsed.clients.forEach(function(c){
          c.status = c.status===undefined ? null : c.status;
          c.notes = c.notes===undefined ? "" : c.notes;
          if(!c.sessions){
            // migrate the old per-day abatido/closed map (if any) into the new
            // per-comanda "sessions" model, one session per day it covered
            c.sessions = [];
            if(c.dayStatus){
              Object.keys(c.dayStatus).forEach(function(iso){
                var ds = c.dayStatus[iso] || {};
                var sid = uid();
                c.sessions.push({ id:sid, closed:!!ds.closed, abatido: ds.abatido||0 });
                (parsed.sales||[]).forEach(function(s){
                  if(s.clientId===c.id && s.date.slice(0,10)===iso && !s.comandaSessionId) s.comandaSessionId = sid;
                });
              });
            }
          }
          delete c.dayStatus;
        });
        parsed.title = validTitle(parsed.title);
        normalizeHotkeys(parsed.items);
        return parsed;
      }
    }catch(e){}
    return { title:APP_TITLE_SHORT, items:[], sales:[], priceLog:[], restockLog:[], dailyAdjustments:{}, titleFont:null, theme:"snooker", password:"1234", adminPassword:"admin", clients:[] };
  }
  function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){} }

  var data = loadData();

  // ---------- state ----------
  var state = {
    screen:"dashboard",
    forwardScreen:null,
    themePickerPage:0,
    daysShown:6,
    selectedItemId:null,
    salesFilterDays:1,
    groupedSales:false,
    modal:null,
    toast:null,
    editingDaily:null,
    lastEdit:null,
    colorPicker:null,
    selectedClientId:null,
    comandaDetailOrigin:null,
    openDebtsOrigin:null,
    comandaLastAction:null,
    notesModal:null,
    lastSaleItemId:null,
    lastSaleClientId:null,
    lastSalePriceOverride:null,
    titleLongPress:0,
    hotkeyItemId:null,
    avulsoSel:[],
    avulsoPrinted:false,

    loggedIn:false,
    role:null,
    loginRole:"admin",
    loginError:null,
    loginFading:false,
    changePasswordError:null

  // ---------- helpers ----------
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function pad2(n){ return n<10 ? "0"+n : ""+n; }
  function localDateISO(d){
    d = d || new Date();
    return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  }
  function nowLocalISO(){
    // local date+time in an ISO-like format WITHOUT a "Z"/offset suffix, so
    // it is always read back using the device's own current clock and
    // timezone (never UTC), keeping the calendar day in sync with the
    // notebook/phone's actual local time instead of jumping early/late.
    var d = new Date();
    return localDateISO(d)+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds())+"."+(d.getMilliseconds()+"").padStart(3,"0");
  }
  function todayISO(){ return localDateISO(); }
  function fmtDateShort(iso){
    var d = new Date(iso+"T00:00:00");
    return String(d.getDate()).padStart(2,"0")+" "+MONTHS_LABEL[d.getMonth()];
  }
  function fmtDaySeparator(iso){
    var d = new Date(iso+"T00:00:00");
    return d.getDate()+" "+MONTHS_LABEL_CAP[d.getMonth()]+" - "+WEEKDAY_LABEL_FULL[d.getDay()];
  }
  function fmtDateTime(iso){
    var d = new Date(iso);
    return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+" às "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function fmtTime(iso){
    var d = new Date(iso);
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function activeClients(){ return data.clients.filter(function(c){ return !c.deleted; }); }
  function findClient(id){
    return data.clients.find(function(c){ return c.id===id; });
  }
  function findSession(client, sessionId){
    return client && client.sessions && client.sessions.find(function(s){ return s.id===sessionId; });
  }
  function getOrCreateOpenSession(client){
    client.sessions = client.sessions || [];
    var last = client.sessions[client.sessions.length-1];
    if(last && !last.closed) return last;
    var s = { id:uid(), closed:false, abatido:0 };
    client.sessions.push(s);
    return s;
  }
  function clientHasOpenDebt(c){
    return (c.sessions||[]).some(function(s){
      if(s.closed) return false;
      var agg = sessionAggregate(c.id, s.id);
      var devido = agg.gasto - (s.abatido||0);
      return devido > 0.001;
    });
  }
  function sessionAggregate(clientId, sessionId){
    var gasto=0, lucro=0;
    data.sales.forEach(function(s){
      if(s.clientId===clientId && s.comandaSessionId===sessionId){
        gasto += s.qty*s.sellPrice;
        lucro += s.qty*(s.sellPrice-s.buyPrice);
      }
    });
    return {gasto:gasto, lucro:lucro};
  }
  function fmtBRL(n){
    return "R$ " + (Math.round(n*100)/100).toFixed(2).replace(".",",");
  }
  function isoDaysAgo(n){
    var d = new Date();
    d.setDate(d.getDate()-n);
    return localDateISO(d);
  }
  function parseBRLInput(str){
    // accepts "8,50" "10" "12.99" - rejects "12,999" or garbage
    if(typeof str !== "string") return null;
    str = str.trim();
    if(!/^\d+([.,]\d{1,2})?$/.test(str)) return null;
    var normalized = str.replace(",", ".");
    var val = parseFloat(normalized);
    if(isNaN(val) || val < 0) return null;
    return val;
  }
  function parseSignedBRL(str){
    // like parseBRLInput but allows a leading minus (used for the editable dashboard totals)
    if(typeof str !== "string") return null;
    str = str.trim();
    if(!/^-?\d+([.,]\d{1,2})?$/.test(str)) return null;
    var val = parseFloat(str.replace(",", "."));
    if(isNaN(val)) return null;
    return val;
  }
  function parseBRLOrDivision(str){
    // accepts everything parseBRLInput does, plus "a/b" or "a b" (division)
    // formato: "unidades valor" (ou "unidades/valor"), ex.: "12 60" -> 60/12 = 5
    // — digita-se primeiro quantos itens, depois quanto foi pago no total.
    if(typeof str !== "string") return null;
    var trimmed = str.trim();
    var divMatch = trimmed.match(/^(\d+(?:[.,]\d+)?)\s*[\/\s]\s*(\d+(?:[.,]\d+)?)$/);
    if(divMatch){
      var units = parseFloat(divMatch[1].replace(",", "."));
      var total = parseFloat(divMatch[2].replace(",", "."));
      if(isNaN(units) || isNaN(total) || units===0) return null;
      var result = total / units;
      return Math.round(result * 100) / 100;
    }
    return parseBRLInput(trimmed);
  }
  function toBRLInputStr(n){
    return (Math.round(n*100)/100).toFixed(2).replace(".",",");
  }
  function getDayAdjustment(iso, field){
    var adj = data.dailyAdjustments && data.dailyAdjustments[iso];

  }
  function getDayValue(iso, field, computed){
    return computed + getDayAdjustment(iso, field);
  }

  // ---------- derived data ----------
  // venda ao cliente "Avulso" ainda sem baixa: o valor fica pendente (entre colchetes).
  // vendas antigas (sem o campo baixa) são tratadas como já pagas.
  function isAvulsoPending(s){ return !s.clientId && s.baixa===false; }

  function dayTotals(iso){
    var compras=0, vendas=0;
    data.items.forEach(function(it){
      (it.restocks||[]).forEach(function(r){
        if(r.date.slice(0,10)===iso) compras += r.qty*r.buyPrice;
      });
    });
    // for sales tied to a client's comanda, only revenue actually collected —
    // via abatimentos or a fully closed (PAGO) comanda — counts as realized
    // profit; the rest is "pendente" until it's paid off.
    var lucro = 0, pendente = 0;
    data.sales.forEach(function(s){
      if(s.date.slice(0,10)!==iso) return;
      vendas += s.qty*s.sellPrice;
      var saleLucro = s.qty*(s.sellPrice-s.buyPrice);
      var saleGasto = s.qty*s.sellPrice;
      if(!s.clientId){ if(isAvulsoPending(s)) pendente += saleGasto; else lucro += saleLucro; return; }
      var c = findClient(s.clientId);
      var session = c && findSession(c, s.comandaSessionId);
      if(!session){ pendente += saleGasto; return; }
      if(session.closed){
        lucro += saleLucro;
      } else {
        var agg = sessionAggregate(s.clientId, session.id);
        var paidFraction = agg.gasto>0 ? Math.min(1, (session.abatido||0)/agg.gasto) : 0;
        lucro += saleLucro*paidFraction;
        pendente += saleGasto*(1-paidFraction);
      }
    });
    return {compras:compras, vendas:vendas, lucro:lucro, pendente:pendente};
  }

    var r = app.getBoundingClientRect();

    var left = r.left + parseFloat(cs.paddingLeft);
    var right = document.documentElement.clientWidth - (r.right - parseFloat(cs.paddingRight));

    root.setProperty("--col-left", left+"px");
    root.setProperty("--col-right", right+"px");

  function renderSoldItems(){
    var html = "";
    var days = [1,5,10,15,30,60];
    html += '<div class="sold-tabs">'+days.map(function(d, i){
      var label = d===1 ? "Hoje" : d+" dias";
      return '<button class="sold-tab'+(state.salesFilterDays===d?' active':'')+'" style="z-index:'+(10-i)+'" data-action="filter-sales" data-days="'+d+'" data-label="'+label+'">'+label+'</button>';
    }).join("")+'</div>';

    var cutoff = isoDaysAgo(state.salesFilterDays-1);
    var filtered = data.sales.filter(function(s){ return s.date.slice(0,10) >= cutoff; }).slice().reverse();
    var totalLucro = filtered.reduce(function(acc,s){ return acc + s.qty*(s.sellPrice-s.buyPrice); }, 0);
    var totalPendente = filtered.reduce(function(acc,s){
      if(!s.clientId) return isAvulsoPending(s) ? acc + s.qty*s.sellPrice : acc;
      var saleGasto = s.qty*s.sellPrice;
      var c = findClient(s.clientId);
      var session = c && findSession(c, s.comandaSessionId);
      if(!session) return acc + saleGasto;
      if(session.closed) return acc;
      var agg = sessionAggregate(s.clientId, session.id);
      var paidFraction = agg.gasto>0 ? Math.min(1, (session.abatido||0)/agg.gasto) : 0;
      return acc + saleGasto*(1-paidFraction);
    }, 0);

    html += '<div class="card"><div class="card-head"><h2>Itens vendidos</h2></div>';
    if(filtered.length===0) html += '<div class="empty">Nenhuma venda no período.</div>';
    else {
      // clicking an item's name groups all of its sales in the selected period into one
      // row; grouped items are listed first, in alphabetical order, and clicking again ungroups
      var gKey = String(state.salesFilterDays);
      var grouped = (state.groupedItems && state.groupedItems[gKey]) || {};
      var groupRows = {};
      filtered.forEach(function(s){
        if(!grouped[s.itemName]) return;
        if(!groupRows[s.itemName]) groupRows[s.itemName] = {name:s.itemName, qty:0, value:0};
        groupRows[s.itemName].qty += s.qty;
        groupRows[s.itemName].value += s.qty*s.sellPrice;
      });
      var groupList = Object.keys(groupRows).map(function(k){ return groupRows[k]; })
        .sort(function(a,b){ return a.name.localeCompare(b.name, "pt-BR", {sensitivity:"base"}); });
      html += groupList.map(function(g){
        return '<div class="sale-row grouped-row"><span><span class="sale-name" data-action="toggle-group-item" data-name="'+escapeHtml(g.name)+'" title="Clique para desagrupar">'+escapeHtml(g.name)+'</span> <span class="meta">×'+g.qty+'</span></span>'
          + '<span class="num">'+fmtBRL(g.value)+'</span></div>';
      }).join("");
      var lastSaleDate = groupList.length ? "__grouped__" : null;
      html += filtered.map(function(s){
        if(grouped[s.itemName]) return "";
        var rowHtml = "";
        var saleDateOnly = s.date.slice(0,10);
        if(saleDateOnly !== lastSaleDate){
          rowHtml += '<div class="day-separator">'+fmtDaySeparator(saleDateOnly)+'</div>';
          lastSaleDate = saleDateOnly;
        }
        rowHtml += '<div class="sale-row"><span><span class="sale-name" data-action="toggle-group-item" data-name="'+escapeHtml(s.itemName)+'" title="Clique para agrupar este item no período">'+escapeHtml(s.itemName)+'</span> <span class="meta">×'+s.qty+'</span></span>'
          + '<span class="num">'+fmtBRL(s.qty*s.sellPrice)+'</span></div>';
        return rowHtml;
      }).join("");
    }
    html += '<div class="summary-total"><span class="label">Lucro total no período</span>'
      + '<span class="value-group">'
      + '<span class="value num" title="Lucro real: '+fmtBRL(totalLucro-totalPendente)+'">'+fmtBRL(totalLucro)+'</span>'
      + '<span class="pendente-val clickable" data-action="open-open-debts" title="Ver clientes com comandas em aberto">['+fmtBRL(totalPendente)+']</span>'
      + '</span></div>';
    html += '</div>';
    return html;
  }

  function renderComandaDetail(){
    var c = findClient(state.selectedClientId);
    if(!c){ state.screen="comandas"; return renderComandas(); }
    var html = backArrowBtn() + '<h2 style="font-size:18px;margin-bottom:14px;">'+escapeHtml(c.name)+'</h2>';

    var clientSales = data.sales.filter(function(s){ return s.clientId===c.id; }).slice().reverse();

    html += '<div class="card">';
    if(clientSales.length===0){
      html += '<div class="empty">Nenhuma compra registrada.</div>';
    } else {
      // group by comanda (session) first — a client can have more than one
      // comanda if a previous one was fully paid and new sales came in after —
      // then show each comanda's items broken up by day within it.
      var sessionGroups = [];
      var bySession = {};
      clientSales.forEach(function(s){
        var sid = s.comandaSessionId || "_legacy";
        if(!bySession[sid]){ bySession[sid] = { sessionId:sid, items:[] }; sessionGroups.push(bySession[sid]); }
        bySession[sid].items.push(s);
      });
      html += sessionGroups.map(function(sg){
        var totalGasto = sg.items.reduce(function(acc,s){ return acc + s.qty*s.sellPrice; }, 0);
        var session = findSession(c, sg.sessionId) || {abatido:0, closed:false};
        var devido = Math.max(0, totalGasto - (session.abatido||0));

        // merge the comanda's sales with its recorded abatimentos so both
        // show up in one chronological (oldest-first) list, and work out how
        // much was still owed right after each abatimento
        var entries = sg.items.map(function(s, i){ return {kind:"sale", date:s.date, ord:i, sale:s}; });
        var pays = (session.payments||[]);
        pays.forEach(function(pm, i){ entries.push({kind:"pay", date:pm.date, ord:-1-i, pay:pm}); });
        var asc = entries.slice().sort(function(a,b){
          if(a.date!==b.date) return a.date<b.date?-1:1;
          if(a.kind!==b.kind) return a.kind==="sale"?-1:1;
          return a.kind==="sale" ? b.ord-a.ord : b.ord-a.ord;
        });
        var runGasto=0, runPaid=0;
        asc.forEach(function(en){
          if(en.kind==="sale") runGasto += en.sale.qty*en.sale.sellPrice;
          else { runPaid += en.pay.amount; en.falta = Math.max(0, runGasto-runPaid); }
        });
        // oldest entries first, most recent at the bottom
        var sortedEntries = asc;

        var dayGroups = [];
        var byIso = {};
        sortedEntries.forEach(function(en){
          var iso = en.date.slice(0,10);
          if(!byIso[iso]){ byIso[iso] = { iso:iso, items:[] }; dayGroups.push(byIso[iso]); }
          byIso[iso].items.push(en);
        });
        var itemsHtml = dayGroups.map(function(g, gIdx){
          var rowsHtml = g.items.map(function(en){
            if(en.kind==="pay"){
              return '<div class="sale-row payment-row"><span>VALOR ABATIDO <span class="meta">· '+fmtTime(en.date)+'</span></span>'
                + '<span class="num">'+fmtBRL(en.pay.amount)+'</span></div>'
                + '<div class="subtotal-row"><span>Falta pagar</span><b class="num">'+fmtBRL(en.falta)+'</b></div>';
            }
            var s = en.sale;
            var editable = !session.closed && !session.transferred;
            var acts = "";
            if(editable){
              acts = '<button type="button" class="csq-btn" data-action="open-comanda-add" data-sale-id="'+s.id+'" aria-label="Acrescentar">+</button>'
                + (isAdmin() ? '<button type="button" class="csq-btn del" data-action="open-comanda-del" data-sale-id="'+s.id+'" aria-label="Excluir">−</button>' : '');
            }
            return '<div class="sale-row"><span>'+escapeHtml(s.itemName)+' <span class="meta">×'+s.qty+' · '+fmtTime(s.date)+'</span></span>'
              + '<span class="sale-right"><span class="num">'+fmtBRL(s.qty*s.sellPrice)+'</span>'+acts+'</span></div>';
          }).join("");
          var sep = fmtDaySeparator(g.iso);
          if(gIdx===0){
            // dayGroups runs from the oldest day to the most recent, so the
            // first group is the earliest day of this comanda — the day of
            // its very first purchase. Items within a day are also oldest
            // first, so the first item there is that first purchase.
            var firstPurchase = g.items[0];
            sep += ' <span class="first-purchase-time">· '+fmtTime(firstPurchase.date)+'</span>';
          }
          return '<div class="day-separator">'+sep+'</div>' + rowsHtml;
        }).join("");

        var totalRowHtml;
        if(session.transferred){
          // transferred to the other system — same slot/layout as PAGO, but
          // uppercase italic text, and (like PAGO) not clickable/revertible
          totalRowHtml = '<div class="comanda-day-total closed">'
            + '<h2 class="label"></h2>'
            + '<h2 class="pago-label transferida-label" style="cursor:pointer;" data-action="open-undo-transfer" data-client-id="'+c.id+'" data-session-id="'+sg.sessionId+'" title="Clique para desfazer a transferência">TRANSFERIDA P/ OUTRO SISTEMA</h2>'
            + '<h2 class="value num strike">'+fmtBRL(totalGasto)+'</h2>'
            + '</div>';
        } else if(session.closed){
          // once fully paid, the "Total gasto" label is replaced by empty,
          // non-interactive space, and "PAGO" is no longer clickable (the
          // layout, sizes and styling stay exactly the same)
          totalRowHtml = '<div class="comanda-day-total closed">'
            + '<h2 class="label"></h2>'
            + '<h2 class="pago-label pago-label-disabled">PAGO</h2>'
            + '<h2 class="value num strike">'+fmtBRL(totalGasto)+'</h2>'
            + '</div>';
        } else if(devido<=0){
          // fully abated without a formal "Fechar Comanda" — treat the same
          // as paid: empty, non-interactive label showing the full amount
          // that was spent (not the now-zero balance due)
          totalRowHtml = '<div class="comanda-day-total">'
            + '<h2 class="label"></h2>'
            + '<h2 class="value num strike">'+fmtBRL(totalGasto)+'</h2>'
            + '</div>';
        } else {
          totalRowHtml = '<div class="comanda-day-total">'
            + '<h2 class="label">Em aberto</h2>'
            + '<h2 class="value num clickable" data-action="open-abater-comanda" data-client-id="'+c.id+'" data-session-id="'+sg.sessionId+'">'+fmtBRL(devido)+'</h2>'
            + '</div>';
        }
        var transferBtnHtml = "";
        var printRowHtml = '<div class="comanda-print-row">'
          + transferBtnHtml
          + '<button class="comanda-print-btn" type="button" data-action="print-comanda" data-client-id="'+c.id+'" data-session-id="'+sg.sessionId+'" title="Imprimir comanda">🖨️ '+(session.printed?'Imprimir 2ª Via':'Imprimir Comanda')+'</button>'
          + '</div>';
        return itemsHtml + totalRowHtml + printRowHtml;
      }).join('<div class="comanda-session-sep"></div>');
    }
    html += '</div>';
    return html;
  }

  function renderAvulsoProfit(){
    var html = screenHeader("Vendas Avulsas 💰");
    var avulso = data.sales.filter(function(sl){ return !sl.clientId; });
    if(avulso.length===0){ return html + renderAvulsoPaidList() + '<div class="empty">Nenhuma venda avulsa registrada ainda.</div>'; }
    var selKeys = {};
    (state.avulsoSel||[]).forEach(function(k){ selKeys[k]=true; });
    html += renderAvulsoPanel() + renderAvulsoPaidList();
    var groups = {}, order = [], total = 0, pend = 0;
    avulso.forEach(function(sl){
      var key = sl.itemId || sl.itemName;
      if(!groups[key]){ groups[key] = {name:sl.itemName, qty:0, profit:0}; order.push(key); }
      var p = (sl.sellPrice - (sl.buyPrice||0)) * sl.qty;
      groups[key].qty += sl.qty; groups[key].profit += p; total += p;
      if(isAvulsoPending(sl)) pend += sl.qty*sl.sellPrice;
    });
    order.sort(function(a,b){ return groups[b].profit - groups[a].profit; });
    html += '<div class="card"><div class="card-head"><h2>Por produto</h2></div>' + order.map(function(k){
      var g = groups[k];
      return '<div class="hist-line"><span>'+escapeHtml(g.name)+' · '+g.qty+' un.</span><b class="num">'+fmtBRL(g.profit)+'</b></div>';
    }).join("")
      + '<div class="hist-line" style="border-top:1px solid var(--border);margin-top:8px;padding-top:12px;"><span><b>Lucro total</b></span>'
      + '<b class="num">'+fmtBRL(total)+' <span class="pendente-val">['+fmtBRL(pend)+']</span></b></div>'
      + '</div>';
    // every avulso sale, newest first; each registration stays one row (a single unit,
    // or "item ×N" when N were registered at once on the Vendas page)
    var hiddenIds = avulsoHiddenIdSet();
    var list = avulso.filter(function(sl){ return !hiddenIds[sl.id]; }).sort(function(a,b){ return a.date<b.date ? 1 : (a.date>b.date ? -1 : 0); });
    html += '<div class="card"><div class="card-head"><h2>Vendas</h2>'
      + '<button class="chip'+(state.groupedSales?' active':'')+'" data-action="toggle-sales-grouping" title="Agrupar itens com nome e valor idênticos no mesmo dia">'+(state.groupedSales?'Desagrupar':'Agrupar')+'</button>'
      + '</div>';
    var paidIds = avulsoPaidIdSet();
    function rowFor(ids, name, qty, value, dateText, pending){
      var key = ids.join(",");
      var isPaid = ids.every(function(id){ return paidIds[id]; });
      return '<div class="item-row sale-click'+(selKeys[key]?' sel':'')+'"'+(isPaid ? ' style="opacity:.75;"' : ' data-action="avulso-select" data-key="'+key+'" style="cursor:pointer;"')+'>'
        + '<span class="name" style="flex:1;">'+(isPaid?'<span class="pago-tag">[Pago]</span> ':'')+escapeHtml(name)+' <span class="meta">×'+qty+'</span>'+(dateText ? '<br><span class="meta" style="font-size:11px;">'+dateText+'</span>' : '')+'</span>'
        + '<span class="num">'+fmtBRL(value)+(pending ? ' <span class="pendente-val">[pendente]</span>' : ' <span class="pendente-val">✓</span>')+'</span>'
        + '</div>';
    }
    if(!state.groupedSales){
      html += list.map(function(sl){
        return rowFor([sl.id], sl.itemName, sl.qty, sl.qty*sl.sellPrice, fmtDateTime(sl.date), isAvulsoPending(sl));
      }).join("");
    } else {
      // grouped: same item + same sell price + same day + same status become one row
      var gOrder = [], gMap = {}, lastDay = null, out = "";
      list.forEach(function(sl){
        var day = sl.date.slice(0,10), pend = isAvulsoPending(sl);
        var key = day+"|"+sl.itemName+"|"+sl.sellPrice+"|"+(pend?1:0)+"|"+(paidIds[sl.id]?1:0);
        if(!gMap[key]){ gMap[key] = {day:day, name:sl.itemName, qty:0, value:0, ids:[], pending:pend}; gOrder.push(gMap[key]); }
        var g = gMap[key]; g.qty += sl.qty; g.value += sl.qty*sl.sellPrice; g.ids.push(sl.id);
      });
      gOrder.forEach(function(g){
        if(g.day!==lastDay){ out += '<div class="day-separator">'+fmtDaySeparator(g.day)+'</div>'; lastDay = g.day; }
        out += rowFor(g.ids, g.name, g.qty, g.value, "", g.pending);
      });
      html += out;
    }
    html += '</div>';
    return html;
  }

  function renderPriceHistory(){
    var html = screenHeader("Histórico de Preços 📈");
    if(!data.priceLog || data.priceLog.length===0){
      html += '<div class="empty">Nenhuma alteração de preço registrada ainda.</div>';
      return html;
    }
    var order = [];
    var groups = {};
    data.priceLog.forEach(function(entry){
      if(!groups[entry.itemId]){ groups[entry.itemId] = {itemName:entry.itemName, entries:[]}; order.push(entry.itemId); }
      groups[entry.itemId].entries.push(entry);
    });
    // show items with the most recent price change first
    order.sort(function(a, b){
      var latestA = groups[a].entries.reduce(function(m,e){ return e.date>m?e.date:m; }, "");
      var latestB = groups[b].entries.reduce(function(m,e){ return e.date>m?e.date:m; }, "");
      return latestB.localeCompare(latestA);
    });
    html += '<div class="card">';
    html += order.map(function(itemId, idx){
      var g = groups[itemId];
      var stillExists = !!findItem(itemId);
      var hist = g.entries.slice().reverse();
      var lines = hist.map(function(h){
        var qtyPart = (h.qty!=null) ? ' · '+h.qty+' un.' : '';
        return '<div class="hist-line"><span>'+fmtDateTime(h.date)+'</span><b class="num">compra '+fmtBRL(h.buyPrice)+' · venda '+fmtBRL(h.sellPrice)+qtyPart+'</b></div>';
      }).join("");
      return '<div class="hist-block"'+(idx===0?' style="margin-top:0;padding-top:0;border-top:none;"':'')+'>'
        + '<h3>'+escapeHtml(g.itemName)+(stillExists?'':' <span style="font-weight:400;color:var(--text-dim);font-size:12px;">(item removido do estoque)</span>')+'</h3>' + lines + '</div>';
    }).join("");
    html += '</div>';
    return html;
  }

  // ---------- keyboard shortcuts (1–9 -> product on the Vendas page) ----------
  var HOTKEYS = ["1","2","3","4","5","6","7","8","9"];
  // older saves used F1–F12: F1–F9 become 1–9, F10–F12 are dropped
  function normalizeHotkeys(list){
    (list||[]).forEach(function(it){
      var m = typeof it.hotkey==="string" && it.hotkey.match(/^F(\d+)$/);
      if(m){ var n = parseInt(m[1],10); it.hotkey = (n>=1 && n<=9) ? String(n) : null; }
      else if(["1","2","3","4","5","6","7","8","9"].indexOf(it.hotkey)<0) it.hotkey = null;
      if(it.hotkey){ for(var j=0;j<list.length;j++){ if(list[j]!==it && list[j].hotkey===it.hotkey && list.indexOf(list[j])<list.indexOf(it)){ it.hotkey=null; break; } } }
    });
  }
  function hotkeyIndex(k){ return HOTKEYS.indexOf(k); }
  function itemByHotkey(k){ return data.items.filter(function(i){ return i.hotkey===k; })[0]; }
  function renderHotkeysScreen(){
    var html = screenHeader("Atalhos de Teclado");
    if(data.items.length===0){ return html + '<div class="empty">Nenhum produto cadastrado.</div>'; }
    // products with a shortcut come first, ordered 1 -> 9; the rest keep their order
    var withKey = data.items.filter(function(i){ return hotkeyIndex(i.hotkey)>=0; })
      .sort(function(a,b){ return hotkeyIndex(a.hotkey) - hotkeyIndex(b.hotkey); });
    var without = data.items.filter(function(i){ return hotkeyIndex(i.hotkey)<0; });
    html += '<p style="font-size:13px;color:var(--text-dim);margin:0 0 12px;">Toque num produto para escolher o número (1 a 9) que seleciona esse produto na página de Vendas. Apertar o número de novo aumenta a quantidade.</p>';
    html += '<div class="card">' + withKey.concat(without).map(function(it){
      return '<div class="item-row" data-action="open-hotkey-modal" data-item="'+it.id+'" style="cursor:pointer;">'
        + '<span class="name">'+escapeHtml(it.name)+'</span>'
        + (hotkeyIndex(it.hotkey)>=0 ? '<span class="hotkey-badge">'+it.hotkey+'</span>' : '')
        + '</div>';
    }).join("") + '</div>';
    return html;
  }

        + '<p style="color:var(--text-dim);font-size:13px;margin:-4px 0 12px;">Valor devido atualmente: '+fmtBRL(acDevido)+'</p>'
        + '<div class="field"><label>Abater da Comanda</label><input id="modal-abater-input" placeholder="Ex: 20,00" autofocus enterkeyhint="go"></div>'

        + '<div class="actions"><button class="btn" style="width:100%;" data-action="modal-submit-abater">Abater</button></div>'

    } else if(m.type==="fontPicker"){

        + '</div>';
    } else if(m.type==="confirmImport"){
      body = '<div class="modal-warn-head">'+ICONS.warning+'<h3>Importar dados?</h3></div>'
        + '<p>Isso vai substituir todos os dados atuais do app (itens, estoque, vendas, preços e histórico) pelos dados do arquivo selecionado. Essa ação não pode ser desfeita.</p>'
        + '<div class="actions"><button class="btn secondary" data-action="modal-cancel">Cancelar</button><button class="btn danger" data-action="modal-confirm-import">Importar e Substituir</button></div>';
    } else if(m.type==="confirmResetData"){
      body = '<div class="modal-warn-head">'+ICONS.warning+'<h3>Zerar todos os dados?</h3></div>'
        + '<p>Isso vai apagar permanentemente produtos, estoque, vendas, clientes e comandas, históricos, senha, tema e título, voltando o app ao estado inicial. Recomendamos exportar um backup antes. Essa ação não pode ser desfeita.</p>'
        + '<div class="actions"><button class="btn secondary" data-action="modal-cancel">Cancelar</button><button class="btn danger" data-action="modal-confirm-reset-data">Zerar Tudo</button></div>';
    } else if(m.type==="confirmResetPassword"){
      body = '<div class="modal-warn-head">'+ICONS.warning+'<h3>Confirme com a senha</h3></div>'
        + '<p>Digite a senha atual para zerar todos os dados do app.</p>'
        + '<div class="field"><input type="password" id="modal-remove-password-input" placeholder="Senha atual" autofocus></div>'
        + (m.error ? '<div class="err">'+escapeHtml(m.error)+'</div>' : '')
        + '<div class="actions"><button class="btn secondary" data-action="modal-cancel">Cancelar</button><button class="btn danger" data-action="modal-confirm-reset-password">Zerar Tudo</button></div>';
    } else if(m.type==="removePassword"){
      body = '<div class="modal-warn-head">'+ICONS.warning+'<h3>Remover senha?</h3></div>'
        + '<p>Digite a senha atual para confirmar. O app deixará de pedir senha ao ser aberto.</p>'
        + '<div class="field"><input type="password" id="modal-remove-password-input" placeholder="Senha atual" autofocus></div>'
        + (m.error ? '<div class="err">'+escapeHtml(m.error)+'</div>' : '')
        + '<div class="actions"><button class="btn secondary" data-action="modal-cancel">Cancelar</button><button class="btn danger" data-action="modal-confirm-remove-password">Remover Senha</button></div>';
    } else if(m.type==="themePicker"){
      var activeThemeId = findTheme(data.theme).id;
      var page = state.themePickerPage || 0;
      var pageThemes = THEMES.slice(page*THEME_PAGE_SIZE, page*THEME_PAGE_SIZE+THEME_PAGE_SIZE);
      var dotsHtml = "";
      if(THEME_PAGE_COUNT>1){
        var dots = [];
        for(var dp=0; dp<THEME_PAGE_COUNT; dp++){
          dots.push('<span class="theme-dot'+(dp===page?' active':'')+'"></span>');
        }
        dotsHtml = '<div class="theme-dots" data-action="cycle-theme-page" title="Clique para ver outra coleção de temas">'+dots.join("")+'</div>';
      }
      body = '<div class="theme-page-wrap" data-action="cycle-theme-page">'
        + '<div class="theme-grid">'
        + pageThemes.map(function(t){
            return '<button class="theme-option'+(t.id===activeThemeId?' active':'')+'" data-action="pick-theme" data-theme-id="'+t.id+'">'
              + '<span class="theme-emoji">'+t.emoji+'</span>'
              + '<span class="theme-name">'+escapeHtml(t.name)+'</span>'

          }).join("")
        + '</div>'

        + dotsHtml
        + '<div class="actions" style="justify-content:flex-end;">'
        + '<button class="btn secondary" data-action="modal-cancel">Fechar</button>'

    }
    var modalClass = (m.type==="confirmDeleteItem" || m.type==="confirmDeleteAvulsoComanda" || (m.type==="comandaSaleQty" && m.mode==="del") || m.type==="confirmDeleteClient" || m.type==="confirmImport" || m.type==="confirmResetData" || m.type==="confirmResetPassword" || m.type==="removePassword") ? "modal modal-danger" : (m.type==="confirmDiscountSale" ? "modal modal-warn-yellow" : ((m.type==="fontPicker" || m.type==="themePicker") ? "modal modal-wide" : "modal"));
    return '<div class="modal-backdrop" data-action="modal-backdrop"><div class="'+modalClass+'">'+body+'</div></div>';
  }

  // ---------- actions ----------
  function bindEvents(){
    alignFabs();
    var app = document.getElementById("app");

    document.onkeydown = function(e){
      if(state.loggedIn && /^[1-9]$/.test(e.key) && !e.ctrlKey && !e.altKey && !e.metaKey){
        var hkTag = document.activeElement ? document.activeElement.tagName : "";
        if(state.modal && state.modal.type==="setHotkey"){
          e.preventDefault();
          assignHotkey(state.modal.itemId, e.key);
          return;
        }
        // on the Vendas page, but never while typing in a text/number field
        if(state.screen==="sales" && !state.modal && hkTag!=="INPUT" && hkTag!=="TEXTAREA" && itemByHotkey(e.key)){
          e.preventDefault();
          handleSalesHotkey(e.key);
          return;
        }
      }
      if(state.loggedIn && e.key==="Escape"){
        e.preventDefault();
        if(state.notesModal) closeClientNotes();
        var hadModal = !!state.modal;
        state.modal = null;
        if(state.screen!=="dashboard"){
          state.forwardScreen = state.screen;
          state.screen = "dashboard";
          state.comandaDetailOrigin=null; state.openDebtsOrigin=null; state.changePasswordError=null;
          state.lastEdit=null; clearUndoExpiry();
          state.comandaLastAction=null; clearComandaUndoExpiry();
        }
        state.colorPicker = null;
        render();
        return;
      }
      if(state.loggedIn && (e.key==="Backspace" || (e.key==="Tab" && !e.shiftKey && !e.ctrlKey && !e.altKey))){
        var bt = document.activeElement ? document.activeElement.tagName : "";
        if(bt==="INPUT" || bt==="TEXTAREA" || bt==="SELECT" || (document.activeElement && document.activeElement.isContentEditable)) return;
        e.preventDefault();
        if(state.notesModal){ closeClientNotes(); return; }
        if(state.modal){ state.modal = null; render(); return; }
        goBackFromCurrentScreen();
        return;
      }
      if(e.key==="ArrowLeft"){
        var activeTag = document.activeElement ? document.activeElement.tagName : "";
        if(activeTag==="INPUT" || activeTag==="TEXTAREA" || activeTag==="SELECT") return;
        if(state.modal && state.modal.type==="themePicker" && THEME_PAGE_COUNT>1){
          state.themePickerPage = (state.themePickerPage - 1 + THEME_PAGE_COUNT) % THEME_PAGE_COUNT;
          render();
          return;
        }
        goBackFromCurrentScreen();
        return;
      }
      if(e.key==="ArrowRight"){
        var activeTagR = document.activeElement ? document.activeElement.tagName : "";
        if(activeTagR==="INPUT" || activeTagR==="TEXTAREA" || activeTagR==="SELECT") return;
        if(state.modal && state.modal.type==="themePicker" && THEME_PAGE_COUNT>1){
          state.themePickerPage = (state.themePickerPage + 1) % THEME_PAGE_COUNT;
          render();
          return;
        }
        goForwardToScreen();
        return;
      }
      if(e.key==="Enter"){
        // generic "Sim"/"OK" confirmation via Enter (ou "Ir"/"Concluído" no
        // teclado do celular) para qualquer prompt aberto que tenha um botão
        // marcado como confirmável assim. Os prompts vermelhos (perigosos/
        // irreversíveis: apagar item, apagar cliente, importar dados,
        // remover senha) e o prompt amarelo (venda com desconto) nunca têm
        // essa marcação de propósito — ver os respectivos botões acima —
        // então essa checagem por classe já os exclui automaticamente.
        // Skipped when focus is on an input, textarea, select or button:
        // those already have their own specific Enter handling (see
        // app.onkeydown) or native button-press behavior.
        var activeTag2 = document.activeElement ? document.activeElement.tagName : "";
        if(activeTag2==="INPUT" || activeTag2==="TEXTAREA" || activeTag2==="SELECT" || activeTag2==="BUTTON") return;
        if(state.modal){
          var confirmBtn = document.querySelector(".modal-backdrop .btn-confirm-enter");
          if(confirmBtn) confirmBtn.click();
          return;
        }
        // no modal open: if a transient "Desfazer" button is currently
        // showing (dashboard daily-edit undo, or comanda-action undo),
        // Enter triggers it just like a click — it performs its undo and
        // disappears, unless doing so leaves a new "Desfazer" in its place.
        var undoBtn = document.querySelector(".undo-btn");
        if(undoBtn){ undoBtn.click(); return; }
        if(state.loggedIn && state.screen==="comandas" && !state.notesModal){
          var ncn = document.getElementById("new-client-name");
          if(ncn && ncn.value.trim()) doAddClient(); else if(ncn) ncn.focus();
          return;
        }
        if(state.loggedIn && isAdmin() && state.screen==="stock" && !state.notesModal){
          state.modal={type:"newProduct"}; render(); focusModalInput();
        }
      }
    };

    app.onclick = function(e){
      var el = e.target.closest("[data-action]");
      if(el && (el.getAttribute("data-action")==="open-item" || el.getAttribute("data-action")==="open-color-picker") && Date.now()-itemLongPressedAt<900){ return; }
      if(el && el.id==="app-title" && Date.now()-titleLongPressedAt<900){ return; }
      if(!el) return;
      var action = el.getAttribute("data-action");

      // ações restritas ao administrador (barradas aqui mesmo que o botão apareça)
      if(ADMIN_ONLY_ACTIONS[action] && adminOnlyDenied()) return;

      if(action==="exit-cancel"){ state.exitPrompt = false; render(); }
      else if(action==="exit-confirm"){ doExitApp(); }
      else if(action==="login-role"){ state.loginRole = el.getAttribute("data-role")==="admin" ? "admin" : "user"; state.loginError = null; render(); }
      else if(action==="go-dashboard"){ state.screen="dashboard"; state.forwardScreen=null; state.comandaDetailOrigin=null; state.openDebtsOrigin=null; state.colorPicker=null; state.comandaLastAction=null; clearComandaUndoExpiry(); render(); }
      else if(action==="go-back-icon"){ goBackFromCurrentScreen(); }
      else if(action==="nav"){ state.screen = el.getAttribute("data-screen"); state.forwardScreen=null; state.comandaDetailOrigin=null; state.openDebtsOrigin=null; state.lastEdit=null; clearUndoExpiry(); state.colorPicker=null; state.comandaLastAction=null; clearComandaUndoExpiry(); render(); }
      else if(action==="open-font-picker"){ state.modal = {type:"fontPicker"}; render(); }
      else if(action==="export-data"){ exportData(); }
      else if(action==="import-data"){ triggerImport(); }
      else if(action==="modal-confirm-import"){ applyImport(); }
      else if(action==="open-reset-data"){ state.modal={type:"confirmResetData"}; render(); }
      else if(action==="modal-confirm-reset-data"){
        state.modal={type:"confirmResetPassword", error:null}; render(); focusModalInput();
      }
      else if(action==="modal-confirm-reset-password"){ doConfirmResetPassword(); }
      else if(action==="open-settings"){ state.screen="settings"; state.forwardScreen=null; state.lastEdit=null; clearUndoExpiry(); state.colorPicker=null; render(); window.scrollTo(0,0); if(document.scrollingElement) document.scrollingElement.scrollTop=0; }
      else if(action==="logoff"){ doLogoff(); }
      else if(action==="open-theme-picker"){
        var curThemeId = findTheme(data.theme).id;
        var curThemeIdx = -1;
        for(var cti=0; cti<THEMES.length; cti++){ if(THEMES[cti].id===curThemeId){ curThemeIdx=cti; break; } }
        state.themePickerPage = curThemeIdx>=0 ? Math.floor(curThemeIdx/THEME_PAGE_SIZE) : 0;
        state.modal = {type:"themePicker"};
        render();
      }
      else if(action==="cycle-theme-page"){ state.themePickerPage = (state.themePickerPage+1) % THEME_PAGE_COUNT; render(); }
      else if(action==="open-change-password"){ state.changePasswordError=null; state.screen="changePassword"; state.forwardScreen=null; render(); }
      else if(action==="open-remove-password"){ state.modal={type:"removePassword", error:null}; render(); focusModalInput(); }
      else if(action==="modal-confirm-remove-password"){ doRemovePassword(); }
      else if(action==="submit-login"){ doSubmitLogin(); }
      else if(action==="submit-change-password"){ doSubmitChangePassword(); }
      else if(action==="pick-theme"){ setTheme(el.getAttribute("data-theme-id")); }
      else if(action==="pick-font"){ pickTitleFont(el.getAttribute("data-font")); }
      else if(action==="ver-mais"){ state.daysShown += 5; render(); }
      else if(action==="ver-menos"){ state.daysShown = Math.max(6, state.daysShown-5); render(); }
      else if(action==="open-new-product"){ state.modal={type:"newProduct"}; render(); focusModalInput(); }
      else if(action==="add-item"){ doAddItem(); }
      else if(action==="stock-search-run"){ doStockSearchInput(); }
      else if(action==="stock-search-pick"){ pickStockSearchResult(el.getAttribute("data-id")); }
      else if(action==="client-search-run"){ doClientSearchInput(); }
      else if(action==="client-search-pick"){ pickClientSearchResult(el.getAttribute("data-id")); }
      else if(action==="open-open-debts"){ state.openDebtsOrigin = state.screen; state.screen="openDebts"; state.forwardScreen=null; state.comandaDetailOrigin=null; render(); }
      else if(action==="qty-ok"){ doQtyOk(el.getAttribute("data-id")); }
      else if(action==="open-item"){ state.selectedItemId = el.getAttribute("data-id"); state.screen="stockDetail"; state.forwardScreen=null; state.colorPicker=null; render(); }
      else if(action==="filter-sales"){ state.salesFilterDays = parseInt(el.getAttribute("data-days"),10); render(); }
      else if(action==="toggle-group-item"){
        var gk = String(state.salesFilterDays), gn = el.getAttribute("data-name");
        state.groupedItems = state.groupedItems || {};
        state.groupedItems[gk] = state.groupedItems[gk] || {};
        if(state.groupedItems[gk][gn]) delete state.groupedItems[gk][gn]; else state.groupedItems[gk][gn] = true;
        render();

      else if(action==="avulso-select"){ toggleAvulsoSelect(el.getAttribute("data-key")); }
      else if(action==="avulso-unselect"){ var uk = el.getAttribute("data-key"); state.avulsoSel = (state.avulsoSel||[]).filter(function(k){ return k!==uk; }); render(); }
      else if(action==="avulso-clear"){ state.avulsoSel = []; state.avulsoPrinted = false; render(); }
      else if(action==="avulso-print"){ printAvulsoDraft(); }
      else if(action==="avulso-pay"){ payAvulsoDraft(); }

      else if(action==="avulso-toggle-comanda"){ var cid = el.getAttribute("data-id"); state.avulsoOpen = state.avulsoOpen || {}; state.avulsoOpen[cid] = !state.avulsoOpen[cid]; render(); }
      else if(action==="avulso-delete-comanda"){ state.modal = {type:"confirmDeleteAvulsoComanda", id: el.getAttribute("data-id")}; render(); }
      else if(action==="avulso-undo-comanda"){ state.modal = {type:"confirmUndoAvulsoComanda", id: el.getAttribute("data-id")}; render(); }

        if(ucm){
          (ucm.pendedIds||[]).forEach(function(id){ var sl = data.sales.find(function(x){ return x.id===id; }); if(sl && !sl.clientId) sl.baixa = false; });
          data.avulsoComandas = data.avulsoComandas.filter(function(x){ return x.id!==ucm.id; });

      else if(action==="open-transfer-comanda"){ state.modal = {type:"confirmTransferComanda", clientId: el.getAttribute("data-client-id"), sessionId: el.getAttribute("data-session-id")}; render(); }
      else if(action==="modal-confirm-transfer-comanda"){ doTransferComanda(); }
      else if(action==="open-hotkeys"){ state.screen="hotkeys"; state.forwardScreen=null; render(); }
      else if(action==="open-hotkey-modal"){ state.modal = {type:"setHotkey", itemId: el.getAttribute("data-item")}; render(); }
      else if(action==="pick-hotkey"){ assignHotkey(state.modal.itemId, el.getAttribute("data-key")); }
      else if(action==="remove-hotkey"){ assignHotkey(state.modal.itemId, null); }
      else if(action==="open-undo-transfer"){ state.modal = {type:"confirmUndoTransfer", clientId: el.getAttribute("data-client-id"), sessionId: el.getAttribute("data-session-id")}; render(); }
      else if(action==="modal-confirm-undo-transfer"){ doUndoTransfer(); }
      else if(action==="modal-submit-abater"){ submitAbaterComanda(); }
      else if(action==="print-comanda"){ doPrintComanda(el.getAttribute("data-client-id"), el.getAttribute("data-session-id")); }
      else if(action==="fechar-comanda"){ doFecharComanda(); }
      else if(action==="undo-comanda-action"){ undoComandaAction(); }
      else if(action==="open-revert-close"){ state.modal = {type:"confirmRevertClose", clientId: el.getAttribute("data-client-id"), sessionId: el.getAttribute("data-session-id")}; render(); }
      else if(action==="modal-confirm-revert-close"){ doRevertClose(); }
    };

    app.onchange = function(e){
      if(e.target.id==="sale-item"){
        var it = findItem(e.target.value);
        state.lastSaleItemId = e.target.value || null;
        state.lastSalePriceOverride = null;
        state.hotkeyItemId = null;
        var priceField = document.getElementById("sale-price");
        if(priceField) priceField.value = (it && it.sellPrice!=null) ? toBRLInputStr(it.sellPrice) : "";
      } else if(e.target.id==="sale-client"){
        state.lastSaleClientId = e.target.value || null;
      }
    };

    app.onkeydown = function(e){
      var t = e.target;
      if(t.id && (t.id.indexOf("qty-")===0 || t.id==="modal-qty-input" || t.id==="modal-newqty-input") && (e.key==="-" || e.key==="e" || e.key==="E" || e.key==="+")){
        e.preventDefault();
        return;
      }
      if(e.key!=="Enter") return;
      // prompts with no input field (confirmAdd, confirmRemove, etc.) are
      // handled generically by document.onkeydown, since focus normally
      // resets to <body> after a render() and never reaches this #app-scoped
      // handler in that case. Stop this Enter from also bubbling up to that
      // generic handler: without this, submitting one field here (e.g. a
      // quantity) can render a brand-new modal with its own empty input,
      // and the very same keypress would then also click THAT modal's
      // "OK"/"Sim" button before anything was typed into it — surfacing a
      // spurious "Valor Inválido" the user never actually caused.
      e.stopPropagation();
      if(t.id && t.id.indexOf("qty-")===0){ doQtyOk(t.id.slice(4)); }
      else if(t.id==="new-item-name"){ doAddItem(); }
      else if(t.id==="new-client-name"){ doAddClient(); }
      else if(t.id==="modal-rename-input"){ submitRenameItem(); }
      else if(t.id==="modal-price-input"){
        if(state.modal.type==="priceBuy") submitBuyPrice();
        else if(state.modal.type==="priceSell") submitSellPrice();
        else if(state.modal.type==="editPrice") submitEditPrice();
      } else if(t.id==="modal-qty-input"){
        if(state.modal && state.modal.type==="comandaSaleQty") submitComandaSaleQty();
        else if(state.modal && state.modal.type==="manualAddStockQty") submitManualAddStockQty();
        else submitManualRemoveQty();
      }
      // "Remover senha?" é um prompt vermelho (perigoso/irreversível): Enter/Ir
      // não confirma essa ação de propósito, exige toque explícito no botão.
      else if(t.id==="modal-abater-input"){ submitAbaterComanda(); }
      else if(t.id==="modal-newqty-input"){ submitNewItemQty(); }
      else if(t.id==="sale-price"){ doRegisterSale(); }
      else if(t.id==="daily-edit-input"){ commitDailyEdit(t); }
      else if(t.id==="login-password-input"){ doSubmitLogin(); }
      else if(t.id==="pix-key" || t.id==="pix-name" || t.id==="pix-city"){ if(state.modal && state.modal.type==="pixConfig") submitPixConfig(); }
      else if(t.id==="change-pw-current" || t.id==="change-pw-new1" || t.id==="change-pw-new2"){ doSubmitChangePassword(); }
    };

    var di = document.getElementById("daily-edit-input");
    if(di) di.addEventListener("blur", function(){ commitDailyEdit(di); });
    var fi = document.getElementById("import-file-input");
    if(fi) fi.onchange = handleImportFileChange;
    var cnt = document.getElementById("client-notes-textarea");
    if(cnt){
      cnt.addEventListener("input", function(){
        var c = state.notesModal && findClient(state.notesModal.clientId);
        if(!c) return;
        c.notes = cnt.value;
        saveData();
      });
    }
    document.querySelectorAll("#app .item-row[data-id]").forEach(function(row){
      var tmr = null, sx = 0, sy = 0;
      var cancel = function(){ if(tmr){ clearTimeout(tmr); tmr = null; } };
      row.addEventListener("pointerdown", function(e){
        if(e.target.closest(".icon-btn")) return;
        cancel();
        sx = e.clientX; sy = e.clientY;
        tmr = setTimeout(function(){
          tmr = null;
          itemLongPressedAt = Date.now();
          state.modal = {type:"renameItem", itemId:row.getAttribute("data-id")};
          state.colorPicker = null;
          render(); focusModalInput();
        }, 500);
      });
      row.addEventListener("pointermove", function(e){
        if(tmr && (Math.abs(e.clientX-sx)>14 || Math.abs(e.clientY-sy)>14)) cancel();
      });
      ["pointerup","pointercancel"].forEach(function(ev){ row.addEventListener(ev, cancel); });
      row.addEventListener("contextmenu", function(e){ e.preventDefault(); });
    });
    var ttl = document.getElementById("app-title");
    if(ttl){
      var ttlTimer = null;
      var ttlCancel = function(){ if(ttlTimer){ clearTimeout(ttlTimer); ttlTimer = null; } };
      ttl.addEventListener("pointerdown", function(){
        ttlCancel();
        ttlTimer = setTimeout(function(){
          ttlTimer = null;
          titleLongPressedAt = Date.now();
          data.title = (data.title===APP_TITLE_SHORT) ? APP_TITLE : APP_TITLE_SHORT;
          saveData();
          render();
        }, 650);
      });
      ["pointerup","pointerleave","pointercancel","pointermove"].forEach(function(ev){ ttl.addEventListener(ev, ttlCancel); });
      ttl.addEventListener("contextmenu", function(e){ e.preventDefault(); });
    }
    var ssi = document.getElementById("stock-search-input");
    if(ssi){
      ssi.addEventListener("input", doStockSearchInput);
      ssi.addEventListener("keydown", function(e){
        if(e.key==="Enter") doStockSearchInput();
      });
      ssi.addEventListener("blur", function(){
        setTimeout(function(){
          var box = document.getElementById("stock-search-suggestions");
          if(box){ box.innerHTML=""; box.classList.remove("open"); }
        }, 150);
      });
    }
    var csi = document.getElementById("client-search-input");
    if(csi){
      csi.addEventListener("input", doClientSearchInput);
      csi.addEventListener("keydown", function(e){
        if(e.key==="Enter") doClientSearchInput();
      });
      csi.addEventListener("blur", function(){
        setTimeout(function(){
          var box = document.getElementById("client-search-suggestions");
          if(box){ box.innerHTML=""; box.classList.remove("open"); }
        }, 150);
      });
