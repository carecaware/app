  function confirmAddYes(){
    state.modal = {type:"priceBuy", itemId:state.modal.itemId, qty:state.modal.qty};
    render();
    focusModalInput();
  }
  function confirmRemoveYes(){
    doRemoveStock(state.modal.itemId, state.modal.qty);
    state.modal = null;
    render();
  }

  function focusDailyInput(){
    setTimeout(function(){
      var inp = document.getElementById("daily-edit-input");
      if(inp){ inp.focus(); inp.select(); }
    }, 0);
  }

  function commitDailyEdit(inputEl){
    if(!state.editingDaily) return;
    var iso = inputEl.getAttribute("data-iso");
    var field = inputEl.getAttribute("data-field");
    var enteredVal = parseSignedBRL(inputEl.value);
    state.editingDaily = null;
    if(enteredVal===null){ showToast("Valor inválido."); render(); return; }
    var computed = dayTotals(iso)[field];
    var prevAdjustment = getDayAdjustment(iso, field);
    var newAdjustment = enteredVal - computed;
    data.dailyAdjustments = data.dailyAdjustments || {};
    data.dailyAdjustments[iso] = data.dailyAdjustments[iso] || {};
    data.dailyAdjustments[iso][field] = newAdjustment;
    state.lastEdit = {iso:iso, field:field, prevAdjustment:prevAdjustment};
    saveData();
    scheduleUndoExpiry();
    render();
  }

  var undoTimeoutId = null;
  function scheduleUndoExpiry(){
    if(undoTimeoutId) clearTimeout(undoTimeoutId);
    undoTimeoutId = setTimeout(function(){
      undoTimeoutId = null;
      state.lastEdit = null;
      // avoid a full render() here so an in-progress, uncommitted edit
      // elsewhere on screen isn't wiped by this unrelated background timer
      var btn = document.querySelector(".undo-btn[data-action='undo-daily-edit']");
      if(btn) btn.remove();
    }, 5000);
  }
  function clearUndoExpiry(){
    if(undoTimeoutId){ clearTimeout(undoTimeoutId); undoTimeoutId = null; }
  }

  function undoDailyEdit(){
    if(!state.lastEdit) return;
    clearUndoExpiry();
    var e = state.lastEdit;
    data.dailyAdjustments = data.dailyAdjustments || {};
    data.dailyAdjustments[e.iso] = data.dailyAdjustments[e.iso] || {};
    data.dailyAdjustments[e.iso][e.field] = e.prevAdjustment;
    state.lastEdit = null;
    saveData();
    render();
  }

  var comandaUndoTimeoutId = null;
  function scheduleComandaUndoExpiry(){
    if(comandaUndoTimeoutId) clearTimeout(comandaUndoTimeoutId);
    comandaUndoTimeoutId = setTimeout(function(){
      comandaUndoTimeoutId = null;
      state.comandaLastAction = null;
      // avoid a full render() here so the abate modal, if still open with
      // text the person is mid-typing, isn't wiped by this background timer
      var bar = document.querySelector(".comanda-undo-bar");
      if(bar) bar.remove();
    }, 5000);
  }
  function clearComandaUndoExpiry(){
    if(comandaUndoTimeoutId){ clearTimeout(comandaUndoTimeoutId); comandaUndoTimeoutId = null; }
  }

  function submitAbaterComanda(){
    var m = state.modal;
    if(!m || m.type!=="abaterComanda") return;
    var inp = document.getElementById("modal-abater-input");
    var val = parseBRLInput(inp ? inp.value : "");
    if(val===null || val<=0){ m.error = "Valor inválido."; render(); focusModalInput(); return; }
    var c = findClient(m.clientId);
    if(!c){ state.modal=null; render(); return; }
    var session = findSession(c, m.sessionId);
    if(!session){ state.modal=null; render(); return; }
    var agg = sessionAggregate(m.clientId, m.sessionId);
    var prevAbatido = session.abatido || 0;
    var devido = agg.gasto - prevAbatido;
    if(val > devido + 0.001){
      m.error = "Valor maior que o valor devido ("+fmtBRL(devido)+").";
      render();
      focusModalInput();
      return;
    }
    var prevClosed = session.closed;
    var prevPayLen = (session.payments||[]).length;
    session.payments = session.payments || [];
    session.payments.push({date:nowLocalISO(), amount:val});
    session.abatido = prevAbatido + val;
    var willClose = session.abatido >= agg.gasto - 0.001;
    if(willClose) session.closed = true;
    state.comandaLastAction = {kind:"abate", clientId:m.clientId, sessionId:m.sessionId, prevAbatido:prevAbatido, prevClosed:prevClosed, prevPayLen:prevPayLen};
    saveData();
    scheduleComandaUndoExpiry();
    if(willClose){
      state.modal = null;
      render();
      showToast("Comanda paga integralmente.");
    } else {
      m.error = null;
      render();
      focusModalInput();
      showToast("Comanda abatida em "+fmtBRL(val)+".");
    }
  }

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';

  function submitComandaSaleQty(){
    var m = state.modal;
    if(!m || m.type!=="comandaSaleQty") return;
    if(m.mode==="del" && !isAdmin()){ state.modal=null; render(); showToast("Apenas o administrador pode fazer isso."); return; }
    var inp = document.getElementById("modal-qty-input");
    var qty = parseInt(inp ? inp.value : "", 10);
    var sale = data.sales.find(function(x){ return x.id===m.saleId; });
    if(!sale){ state.modal=null; render(); return; }
    var c = sale.clientId ? findClient(sale.clientId) : null;
    var session = c && sale.comandaSessionId ? findSession(c, sale.comandaSessionId) : null;
    if(session && (session.closed || session.transferred)){ state.modal=null; render(); showToast("Esta comanda já foi encerrada."); return; }
    function fail(msg){ state.modal = {type:"comandaSaleQty", mode:m.mode, saleId:m.saleId, error:msg}; render(); focusModalInput(); }
    if(!qty || isNaN(qty) || qty<=0) return fail("Informe uma quantidade válida.");
    var it = findItem(sale.itemId);
    if(m.mode==="del"){
      if(qty > sale.qty) return fail("Esta linha tem apenas "+sale.qty+" un.");
      sale.qty -= qty;
      if(sale.qty<=0){ data.sales.splice(data.sales.indexOf(sale),1); }
      if(it) it.stock = (Number(it.stock)||0) + qty; // item excluído volta ao estoque
      saveData();
      state.modal = null;
      render();
      showToast(qty+" un. de \""+sale.itemName+"\" excluídas da comanda.");
    } else {
      if(!it) return fail("Produto não encontrado no estoque.");
      if(qty > it.stock) return fail("Estoque insuficiente ("+it.stock+" un. disponíveis).");
      it.stock = (Number(it.stock)||0) - qty;
      pushOrMergeSale(it, qty, sale.sellPrice, sale.buyPrice!=null ? sale.buyPrice : 0, sale.clientId, sale.comandaSessionId||null, nowLocalISO());
      saveData();
      state.modal = null;
      render();
      playClickSound();
      showToast(qty+" un. de \""+sale.itemName+"\" acrescentadas à comanda.");
    }
  }

  async function exportData(){
    var exportCopy = JSON.parse(JSON.stringify(data));
    delete exportCopy.password; delete exportCopy.adminPassword; // senhas nunca vão para o arquivo de backup
    var payload = JSON.stringify(exportCopy, null, 2);
    var blob = new Blob([payload], {type:"application/json"});
    var filename = "barra-backup-"+todayISO()+".json";
    // when running inside the Claude Artifact page, use its downloads
    // capability; otherwise (the app opened as a plain local HTML file in
    // any regular browser) window.claude doesn't exist at all, so fall
    // back to the standard browser download method below
    if(window.claude && typeof window.claude.use === "function"){
      try{
        var downloads = await window.claude.use("downloads");
        if(downloads){
          await downloads.save({filename:filename, data:blob});
          showToast("Dados exportados.");
          return;
        }
      }catch(err){
        if(err && err.code==="declined") return;
        // fall through to the standard browser download
      }
    }
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      showToast("Dados exportados.");
    }catch(err){
      showToast("Não foi possível exportar os dados.");
    }
  }

  function handleImportFileChange(e){
    var file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var parsed;
      try{ parsed = JSON.parse(ev.target.result); }catch(err){ parsed = null; }
      if(!parsed || typeof parsed!=="object" || !Array.isArray(parsed.items) || !Array.isArray(parsed.sales)){
        showToast("Arquivo inválido.");
        return;
      }
      state.modal = {type:"confirmImport", payload:parsed};
      render();
    };
    reader.onerror = function(){ showToast("Não foi possível ler o arquivo."); };
    reader.readAsText(file);
  }

  function doRegisterSale(){

    if(!itemSel) return;
    var itemId = itemSel.value;

    if(!qty || qty<=0){ showToast("Quantidade inválida."); return; }
    var price = parseBRLInput(priceInp.value || (it.sellPrice!=null ? String(it.sellPrice).replace(".",","): ""));
    if(price===null){ showToast("Preço de venda inválido."); return; }
    if(qty > it.stock){ showToast("Estoque insuficiente ("+it.stock+" un. disponíveis)."); return; }
    var clientId = (clientSel && clientSel.value) ? clientSel.value : null;
    if(it.sellPrice!=null && price < it.sellPrice - 0.001){
      state.modal = {type:"confirmDiscountSale", itemId:itemId, qty:qty, price:price, clientId:clientId};
      render();

  function pushOrMergeSale(it, qty, price, buyPriceSnapshot, clientId, sessionId, nowIso){
    var todayDateOnly = nowIso.slice(0,10);
    var existingSale = null;
    for(var si=data.sales.length-1; si>=0; si--){
      var existingCandidate = data.sales[si];
      if(existingCandidate.date.slice(0,10) !== todayDateOnly) break;
      if(!clientId) break; // vendas avulsas nunca se fundem: cada registro mantém seu horário
      if(existingCandidate.itemId===it.id && existingCandidate.sellPrice===price && existingCandidate.buyPrice===buyPriceSnapshot && (existingCandidate.clientId||null)===clientId && (existingCandidate.comandaSessionId||null)===sessionId){
        existingSale = existingCandidate;
        break;
      }
    }
    if(existingSale){
      existingSale.qty += qty;
    } else {
      data.sales.push({
        id:uid(), itemId:it.id, itemName:it.name, qty:qty,
        sellPrice:price, buyPrice:buyPriceSnapshot,
        date:nowIso, clientId:clientId, comandaSessionId:sessionId,
        baixa: clientId ? undefined : false
      });
    }
  }

  function completeSale(itemId, qty, price, clientId){
    var it = findItem(itemId);
    if(!it) return;
    var sessionId = null;
    if(clientId){
      var saleClient = findClient(clientId);
      if(saleClient){
        var openSession = getOrCreateOpenSession(saleClient);
        sessionId = openSession.id;
      }
    }
    // o estoque é SEMPRE descontado, antes e independentemente de qualquer
    // data/hora (relógio atrasado ou adiantado não afeta o estoque)
    it.stock = (Number(it.stock)||0) - qty;
    var buyPriceSnapshot = it.buyPrice!=null ? it.buyPrice : 0;
    pushOrMergeSale(it, qty, price, buyPriceSnapshot, clientId, sessionId, nowLocalISO());
    state.lastSaleItemId = itemId;
    state.lastSaleClientId = clientId;
    state.hotkeyItemId = null;
    saveData();
    render();
    playClickSound();
    showToast("Venda registrada");
  }

  function doUndoSale(){
    var itemSel = document.getElementById("sale-item");
    var qtyInp = document.getElementById("sale-qty");
    if(!itemSel) return;
    var itemId = itemSel.value;
    var it = findItem(itemId);
    if(!it) return;
    var qty = parseInt(qtyInp.value, 10);
    if(!qty || qty<=0){ showToast("Quantidade inválida."); return; }

    var paidAv = avulsoPaidIdSet();
    var totalSoldForItem = data.sales.filter(function(s){ return s.itemId===itemId && !s.clientId && !paidAv[s.id]; })
      .reduce(function(acc,s){ return acc + s.qty; }, 0);
    if(qty > totalSoldForItem){
      showToast("Quantidade maior que o total vendido deste item.");
      return;
    }

    var remaining = qty;
    for(var i=data.sales.length-1; i>=0 && remaining>0; i--){
      var s = data.sales[i];
      if(s.itemId !== itemId || s.clientId || paidAv[s.id]) continue; // itens de comanda (ou de comanda paga) não voltam ao estoque por aqui
      if(s.qty <= remaining){
        remaining -= s.qty;
        data.sales.splice(i,1);
      } else {
        s.qty -= remaining;
        remaining = 0;
      }
    }
    it.stock += qty;
    saveData();
    render();
    playClickSound();
    showToast("Venda desfeita");
  }

  function doSubmitLogin(){
    var input = document.getElementById("login-password-input");
    var entered = input ? input.value : "";
    if(entered === pwFor(state.loginRole)){
      state.role = state.loginRole==="admin" ? "admin" : "user";
      state.exitPrompt = false;
      state.loggedIn = true;
      state.loginError = null;
      state.loginFading = true;
      render();
    } else {
      state.loginError = "Senha incorreta.";
      render();
    }
  }

  function doSubmitChangePassword(){
    var hasPassword = true;
    var currentInput = document.getElementById("change-pw-current");
    var current = currentInput ? currentInput.value : "";
    var new1 = document.getElementById("change-pw-new1").value;
    var new2 = document.getElementById("change-pw-new2").value;
    if(current !== pwFor(state.role)){
      state.changePasswordError = "Senha atual incorreta.";
      render();
      return;
    }
    if(!new1){
      state.changePasswordError = "Digite a nova senha.";
      render();
      return;
    }
    if(new1 !== new2){
      state.changePasswordError = "As senhas não coincidem.";
      render();
      return;
    }
    if(isAdmin()) data.adminPassword = new1; else data.password = new1;
    saveData();
    state.changePasswordError = null;
    state.screen = "settings";
    state.forwardScreen = null;
    render();
    showToast(hasPassword ? "Senha alterada." : "Senha definida.");
  }

  function doConfirmResetPassword(){
    var input = document.getElementById("modal-remove-password-input");
    if((input ? input.value : "") !== pwFor(state.role)){
      state.modal.error = "Senha incorreta.";
      render();
      focusModalInput();
      return;
    }
    doResetData();
  }

  function doRemovePassword(){
    var input = document.getElementById("modal-remove-password-input");
    var entered = input ? input.value : "";
    if(entered !== data.password){
      state.modal.error = "Senha incorreta.";
      render();
      focusModalInput();
      return;
    }
    data.password = null;
    saveData();
    state.modal = null;
    render();
    showToast("Senha removida.");
  }

  // ---------- button click sound (settings area only) ----------
  // plain, short "tick" synthesised with WebAudio (no audio files needed)
  var clickAudioCtx = null;
  var soundMuted = false;
  try{ soundMuted = localStorage.getItem("barapp_muted")==="1"; }catch(err){}
  function toggleMute(){
    soundMuted = !soundMuted;
    try{ localStorage.setItem("barapp_muted", soundMuted ? "1" : "0"); }catch(err){}
    render();
    if(!soundMuted) playClickSound();
  }
  function playClickSound(){
    if(soundMuted) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!clickAudioCtx) clickAudioCtx = new AC();
      if(clickAudioCtx.state==="suspended") clickAudioCtx.resume();
      var t0 = clickAudioCtx.currentTime;
      var osc = clickAudioCtx.createOscillator();
      var gain = clickAudioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(760, t0);
      osc.frequency.exponentialRampToValueAtTime(420, t0+0.05);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.18, t0+0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.06);
      osc.connect(gain); gain.connect(clickAudioCtx.destination);
      osc.start(t0); osc.stop(t0+0.07);
    }catch(err){}
  }
  var SETTINGS_MODAL_TYPES = { pixConfig:1, themePicker:1, removePassword:1, confirmImport:1, confirmResetData:1, confirmResetPassword:1 };
  document.addEventListener("click", function(e){
    var btn = e.target && e.target.closest ? e.target.closest("button, [data-action='pick-theme'], [data-action='cycle-theme-page']") : null;
    if(!btn) return;
    var opensSettings = btn.getAttribute("data-action")==="open-settings";
    var inSettings = (state.screen==="settings" || state.screen==="changePassword") && (!state.modal || SETTINGS_MODAL_TYPES[state.modal.type]);
    if(opensSettings || inSettings) playClickSound();
  }, true);

  // fonts that are no longer offered fall back to the default one
  if(data.titleFont && !FONT_NAMES.some(function(n){ return data.titleFont.indexOf("'"+n+"'")===0; })){ data.titleFont = null; saveData(); }
  applyTheme();
  render();

  // ---------- phone/system "back" button ----------
  // A sentinel history entry keeps the browser's back button inside the app:
  // back = one section up; on the home screen it returns to the login screen;
  // on the login screen it asks "Você deseja mesmo sair do app?" and, pressed again, leaves.
  var exitAllowed = false;
  function pushTrap(){ try{ history.pushState({barTrap:true}, ""); }catch(e){} }
  function doLogoff(){
    state.loggedIn = false;
    state.role = null;
    state.modal = null;
    state.colorPicker = null;
    state.notesModal = null;
    state.loginError = null;
    state.exitPrompt = false;
    render();
  }
  function doExitApp(){
    exitAllowed = true;
    try{ window.close(); }catch(e){}
    try{ history.back(); }catch(e){}
    // still here after a moment (e.g. a plain browser tab with nothing to go back to)
    setTimeout(function(){
      exitAllowed = false;
      state.exitPrompt = false;
      state.loginError = "Para sair, feche esta aba ou janela do navegador.";
      pushTrap();
      render();
    }, 500);
  }
  function handleSystemBack(){
    if(!state.loggedIn){
      if(state.exitPrompt){ doExitApp(); return; }
      pushTrap();
      state.exitPrompt = true;
      state.loginError = null;
      render();
      return;
    }
    pushTrap();
    if(state.notesModal){ closeClientNotes(); return; }
    if(state.modal){ state.modal = null; render(); return; }
    if(state.screen==="dashboard"){ doLogoff(); return; }
    goBackFromCurrentScreen();
  }
  try{ history.replaceState({barBase:true}, ""); pushTrap(); }catch(e){}
  window.addEventListener("popstate", function(){
    if(exitAllowed) return;
    handleSystemBack();
  });
})();
</script>
</body>
</html>
